services:
  db:
    image: postgres:16-alpine
    container_name: strategic-indicators-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: strategic_indicators
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d strategic_indicators"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategic-indicators-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/strategic_indicators
      - APP_NAME=Strategic Indicators AI
      - ENVIRONMENT=production
      - DEBUG=false
      - AI_PROVIDER=fake
    ports:
      - "8000:8000"

volumes:
  postgres_data:
